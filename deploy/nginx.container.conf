# 容器内 nginx：终止 TLS、托管 SPA、把 API 反代给同容器内的面板。
#
# 这是完整的 nginx.conf（不是 server 片段）：alpine 的 nginx 从
# /etc/nginx/nginx.conf 读取主配置，片段必须放在 conf.d 或 http 块里。
#
# 为什么是 nginx 终止 TLS 而不是面板自己：
#   面板在 PANEL_TRUST_REVERSE_PROXY=true 时要求 PANEL_LISTEN 是回环地址
#   （防止误把"信任反向代理头"的能力暴露到公网）。容器里要让外面能访问，
#   就必须由同容器内的 nginx 监听 0.0.0.0:8443，面板退回 127.0.0.1:8080。
#   这样反代头只能由本机 nginx 提供，信任边界没有被放大。
#
# 订阅令牌是承载凭据：/sub/ 不能进访问日志，也不能被缓存。

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志走 stdout 由容器运行时收集；这里去掉 $request 之外的敏感头。
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # 上传体积：面板的 JSON 上限是 1 MiB，留出余量。
    client_max_body_size 4m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml;

    upstream panel_api {
        # 同容器内的面板进程。用 127.0.0.1 而不是服务名：它们共享网络命名空间。
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/proxypanel/web;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        # 订阅端点：不记录、不缓存（URL 里带 bearer token）。
        location /sub/ {
            access_log off;
            proxy_pass http://panel_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control no-store always;
        }

        location /api/ {
            proxy_pass http://panel_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # 限流按连接来源 IP 计数，不能盲信客户端自带的 X-Forwarded-For。
            proxy_set_header X-Forwarded-For $remote_addr;
            add_header Cache-Control no-store always;
            proxy_read_timeout 120s;
        }

        location = /healthz { proxy_pass http://panel_api/healthz; }
        location = /readyz  { proxy_pass http://panel_api/readyz; }

        # 带指纹的构建产物可以长缓存；index.html 不行。
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA 路由：未命中的路径交给前端路由处理。
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-store always;
        }

        location ~ /\. { deny all; }
    }
}
