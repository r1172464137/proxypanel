# proxypanel 一体化部署：PostgreSQL + Redis + 面板，单个 compose 文件。
#
# bundle 包含面板、PostgreSQL、Redis；example 另带可选的 Agent（profile=node）。
#
# 面板容器**不跑 nginx**：它只提供 HTTP（API + SPA），TLS 必须由宿主机 nginx
# 终止（配置见 deploy/nginx.conf.example）。所以本文件把面板发布到宿主回环，
# 前面必须有一层 nginx 才能对外。
#
# 不能省掉 nginx 直接对局域网暴露：PANEL_DEV=false 时会话 Cookie 带 Secure，
# 浏览器在明文 http 下根本不会回传 Cookie，登录必然失败。
#
# 首次使用：
#   cp .env.bundle.example .env && ${EDITOR:-vi} .env   # 填四个必填值
#   docker compose -f docker-compose.bundle.yml up -d
#   docker compose -f docker-compose.bundle.yml logs -f panel
#   然后按 deploy/nginx.conf.example 配宿主机 nginx 指向 127.0.0.1:${PANEL_PORT}
#
# 三个密码（PG_PASSWORD / REDIS_PASSWORD / PANEL_MASTER_KEY）生成一次后必须固定保存：
# PANEL_MASTER_KEY 是加密成员凭据的钥匙，丢失后数据库里的密码与 UUID 无法恢复。
name: proxypanel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxypanel
      POSTGRES_PASSWORD: "${PG_PASSWORD:?set PG_PASSWORD in .env}"
      POSTGRES_DB: proxypanel
      # 面板与数据库同机同网络，容器间不需要 TLS；不要为此把数据卷放到公网。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxypanel -d proxypanel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 不发布端口：只有同 compose 网络的 panel 能连。需要本机 psql 时再临时
    # 取消下一行注释（务必保持 127.0.0.1 前缀）。
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      # 登录限流是短生命周期数据：给出上限并禁止驱逐，避免把限流计数挤掉
      # 之后悄悄放开爆破窗口。
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 同上：不发布端口。

  panel:
    image: "ghcr.io/r1172464137/proxypanel-panel:${PANEL_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://proxypanel:${PG_PASSWORD}@postgres:5432/proxypanel?sslmode=disable"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/0"
      PANEL_MASTER_KEY: "${PANEL_MASTER_KEY:?set PANEL_MASTER_KEY in .env}"
      # 镜像内置 PANEL_LISTEN=0.0.0.0:8080 / PANEL_TRUST_REVERSE_PROXY=true。
      # 宿主端口始终绑定回环，不能把明文端口直接发布到公网。
      # 设置 PANEL_TLS_CERT 会让面板自己开 TLS，与宿主 nginx 反代互斥。
      #
      # PANEL_PUBLIC_URL 只用于拼订阅链接，必须与浏览器实际访问的地址一致。
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:?set PANEL_PUBLIC_URL in .env}"
      PANEL_MIGRATIONS_DIR: "/app/migrations"
      # 不设置变量则由面板托管 SPA；在 .env 写 PANEL_WEB_ROOT= 则纯 API。
      # 注意用 - 而不是 :-，才能保留显式空值。
      PANEL_WEB_ROOT: "${PANEL_WEB_ROOT-/usr/share/proxypanel/web}"
      # --- 前后端分离部署（可选）---
      # 默认全部留空 = 同源部署，行为与之前一致。
      # 填了 PANEL_ALLOWED_ORIGINS 才启用 CORS。
      PANEL_ALLOWED_ORIGINS: "${PANEL_ALLOWED_ORIGINS:-}"
      # strict（默认）| lax | none。同主域子域用 lax，完全不同域名用 none。
      # none 要求 Secure，且不能与 PANEL_DEV=true 同时使用（启动会报错）。
      PANEL_COOKIE_SAMESITE: "${PANEL_COOKIE_SAMESITE:-strict}"
      # 同主域子域共享会话时设 .example.com；默认空。
      PANEL_COOKIE_DOMAIN: "${PANEL_COOKIE_DOMAIN:-}"
      # 仅在用户表为空时创建管理员；首次登录成功后可以从 .env 删掉这两个值。
      PANEL_ADMIN_USER: "${PANEL_ADMIN_USER:-admin}"
      PANEL_ADMIN_PASSWORD: "${PANEL_ADMIN_PASSWORD:-}"
    ports:
      # 面板容器内是明文 HTTP 8080。这里**只发布到宿主回环**，由宿主机 nginx
      # 反代并终止 TLS。把左边换成别的宿主端口时，记得同步 nginx 的 upstream。
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
