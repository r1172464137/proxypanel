# 容器化部署示例。复制成 docker-compose.yml 后按需修改，不要直接提交真实密钥。
#
# 组成：
#   postgres / redis  —— 面板依赖，只在内网可达
#   panel             —— API + 可选 SPA；TLS 由宿主机 nginx 终止
#   agent             —— 节点端，仅在有节点的主机上启用
#
# 默认由面板托管 SPA；也可设 PANEL_WEB_ROOT=，让宿主 nginx 读取 web-dist。
# 宿主 nginx 反代至 http://127.0.0.1:8081，见 deploy/nginx.conf.example。
# example 包含可选 Agent（profile=node），bundle 则只包含面板与数据库。
name: proxypanel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxypanel
      POSTGRES_PASSWORD: "${PG_PASSWORD:?set PG_PASSWORD}"
      POSTGRES_DB: proxypanel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxypanel -d proxypanel"]
      interval: 10s
      timeout: 5s
      retries: 6
    # 仅本机可达，不发布到公网
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"

  panel:
    image: ghcr.io/r1172464137/proxypanel-panel:${PANEL_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://proxypanel:${PG_PASSWORD}@postgres:5432/proxypanel?sslmode=disable"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/0"
      # 32 字节随机值，base64 编码。生成一次后固定保存：它是加密成员凭据的钥匙，
      # 丢失后数据库里的密码 / UUID 无法恢复，也不能每次启动重新生成。
      PANEL_MASTER_KEY: "${PANEL_MASTER_KEY:?set PANEL_MASTER_KEY}"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:?set PANEL_PUBLIC_URL}"
      # 镜像已内置 PANEL_LISTEN=0.0.0.0:8080 与 PANEL_TRUST_REVERSE_PROXY=true，
      # 容器内不跑 nginx —— TLS 与反代由**宿主机** nginx 负责（deploy/nginx.conf.example）。
      # 不要在这里设 PANEL_TLS_CERT/PANEL_TLS_KEY：那是"面板自己开 TLS"的另一条路径，
      # 与反向代理终止 TLS 互斥，设了之后宿主机 nginx 用 http:// 反代会握手失败。
      #
      # 前端归属二选一：
      #   不设置变量 → 面板托管 SPA；显式空值 → 只提供 API。
      # 单连字符（不是 :-）保留用户设置的空字符串。
      PANEL_WEB_ROOT: "${PANEL_WEB_ROOT-/usr/share/proxypanel/web}"
      #
      # 仅首次启动需要（用户表为空时才会创建管理员）；首次登录成功后删掉这两行。
      PANEL_ADMIN_USER: "${PANEL_ADMIN_USER:-admin}"
      PANEL_ADMIN_PASSWORD: "${PANEL_ADMIN_PASSWORD:-}"
    ports:
      # 只发布到宿主回环，由宿主机 nginx 反代。不要直接暴露到公网。
      # 左边是宿主端口（nginx 的 upstream 指向它），右边是容器内的 8080。
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 只在真正承载节点的机器上启用这一段。
  agent:
    image: ghcr.io/r1172464137/proxypanel-agent:${PANEL_TAG:-latest}
    profiles: [node]
    restart: unless-stopped
    environment:
      # Agent 只接受 https 的 panel_url（纯 http 仅限回环调试）。
      # 用私有 CA 时把 CA 挂进来并通过 SSL_CERT_FILE 指定。
      SSL_CERT_FILE: "/usr/local/share/ca-certificates/panel-ca.crt"
    volumes:
      - /etc/proxypanel/agent.json:/etc/proxypanel/agent.json:ro
      - agentstate:/var/lib/proxypanel-agent
      # 官方 Xray 由使用者自行下载并核对 SHA256，镜像不打包核心。
      - /opt/proxypanel/xray:/opt/xray:ro
      - /etc/proxypanel/panel-ca.crt:/usr/local/share/ca-certificates/panel-ca.crt:ro
    # 节点要对外提供代理端口，按实际节点端口逐个映射。
    ports:
      - "20101:20101"
    # 需要绑定 1024 以下端口时才加；镜像默认不提权。
    # cap_add:
    #   - NET_BIND_SERVICE

volumes:
  pgdata:
  redisdata:
  agentstate:
