# 容器化部署示例。复制成 docker-compose.yml 后按需修改，不要直接提交真实密钥。
#
# 组成：
#   postgres / redis  —— 面板依赖，只在内网可达
#   panel             —— 本仓库构建的面板镜像，自己终止 TLS
#   agent             —— 节点端，仅在有节点的主机上启用
#
# 网页（SPA）不由面板提供：把 CI 产出的 web-dist 交给现有 nginx / OpenResty，
# 由它托管静态文件，并把 /api 与 /sub 反代到 https://127.0.0.1:8443 。
# 探针和契约见 docs/deployment.md 与 deploy/nginx.conf.example。
name: proxypanel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxypanel
      POSTGRES_PASSWORD: "${PG_PASSWORD:?set PG_PASSWORD}"
      POSTGRES_DB: proxypanel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxypanel -d proxypanel"]
      interval: 10s
      timeout: 5s
      retries: 6
    # 仅本机可达，不发布到公网
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"

  panel:
    image: ghcr.io/CHANGE_ME/proxypanel-panel:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://proxypanel:${PG_PASSWORD}@postgres:5432/proxypanel?sslmode=disable"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/0"
      # 32 字节随机值，base64 编码。生成一次后固定保存：它是加密成员凭据的钥匙，
      # 丢失后数据库里的密码 / UUID 无法恢复，也不能每次启动重新生成。
      PANEL_MASTER_KEY: "${PANEL_MASTER_KEY:?set PANEL_MASTER_KEY}"
      # 不要在 compose 里覆盖 PANEL_LISTEN / PANEL_TLS_*：
      # 镜像里已经跑着一个 nginx（deploy/nginx.container.conf）在 8443 上终止 TLS，
      # 面板本身固定监听 127.0.0.1:8080 由它反代。这两个进程由 entrypoint 一起拉起，
      # 如果在这里把 PANEL_LISTEN 改成 0.0.0.0:8443，面板会和 nginx 抢端口，
      # entrypoint 等不到 /healthz 就直接退出。
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:?set PANEL_PUBLIC_URL}"
      PANEL_MIGRATIONS_DIR: "/app/migrations"
      # 仅首次启动需要（用户表为空时才会创建管理员）；首次登录成功后删掉这两行。
      PANEL_ADMIN_USER: "${PANEL_ADMIN_USER:-admin}"
      PANEL_ADMIN_PASSWORD: "${PANEL_ADMIN_PASSWORD:-}"
    volumes:
      # 给容器内的 nginx 用（它不是给面板进程读的）。privkey 必须 root 可读。
      - /etc/proxypanel/certs:/certs:ro
    ports:
      # 只发布到回环，由宿主上的 nginx 反代。不要直接暴露到公网。
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 只在真正承载节点的机器上启用这一段。
  agent:
    image: ghcr.io/CHANGE_ME/proxypanel-agent:latest
    restart: unless-stopped
    environment:
      # Agent 只接受 https 的 panel_url（纯 http 仅限回环调试）。
      # 用私有 CA 时把 CA 挂进来并通过 SSL_CERT_FILE 指定。
      SSL_CERT_FILE: "/usr/local/share/ca-certificates/panel-ca.crt"
    volumes:
      - /etc/proxypanel/agent.json:/etc/proxypanel/agent.json:ro
      - agentstate:/var/lib/proxypanel-agent
      # 官方 Xray 由使用者自行下载并核对 SHA256，镜像不打包核心。
      - /opt/proxypanel/xray:/opt/xray:ro
      - /etc/proxypanel/panel-ca.crt:/usr/local/share/ca-certificates/panel-ca.crt:ro
    # 节点要对外提供代理端口，按实际节点端口逐个映射。
    ports:
      - "20101:20101"
    # 需要绑定 1024 以下端口时才加；镜像默认不提权。
    # cap_add:
    #   - NET_BIND_SERVICE

volumes:
  pgdata:
  redisdata:
  agentstate:
