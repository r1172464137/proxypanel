# 构建并推送容器镜像到 GitHub Container Registry (GHCR)。
#
# 产出两个镜像，多架构（linux/amd64 + linux/arm64）：
#   ghcr.io/<owner>/proxypanel-panel   —— API + 可选 SPA，TLS 由宿主机反代终止
#   ghcr.io/<owner>/proxypanel-agent   —— 节点端 Agent（不打包 Xray）
#
# 同时把构建好的前端产物作为 artifact 上传，供 nginx 部署使用。
#
# 二进制在 runner 上交叉编译（CGO_ENABLED=0，全部依赖为纯 Go），镜像只做 COPY，
# 因此镜像内容与 Go 版本、npm 依赖解析都可从本文件复现。
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify-go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proxypanel
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: proxypanel
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U proxypanel -d proxypanel"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PANEL_TEST_DATABASE_URL: postgres://proxypanel:ci-test-only@127.0.0.1:15432/proxypanel?sslmode=disable
      PANEL_TEST_DB_ISOLATED: '1'
      PANEL_BASH: /bin/bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Build and affected dependency regressions
        run: |
          set -euo pipefail
          go mod verify
          go build ./...
          go test -count=1 ./internal/panel/secrets
          uv run --no-project python scripts/backend-test.py --json \
            store/identity-tx protocol/offline-review
      - name: Vulnerability reachability gate
        # JSON mode does NOT fail on findings. Text mode enforces the default
        # symbol-level gate; retain JSON separately, including module advisories.
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json ./... > govulncheck.json
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Retain raw vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck
          path: govulncheck.json
          retention-days: 30

  build-and-push:
    needs: [verify-go, web-artifact]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile panel and agent
        run: |
          set -euo pipefail
          mkdir -p image-context/bin/amd64 image-context/bin/arm64
          for arch in amd64 arm64; do
            for cmd in panel agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -buildvcs=false \
                -o "image-context/bin/$arch/$cmd" "./cmd/$cmd"
            done
          done
          cp -r migrations image-context/migrations
          # 面板镜像在构建阶段构建前端；运行镜像不再包含 nginx。
          mkdir -p image-context/web
          # Copy the whole web tree: vite/tsc resolve files from the project root,
          # so cherry-picking entries is fragile. node_modules and dist are
          # excluded by image-context/.dockerignore, not here.
          cp -r web/. image-context/web/
          # 记录实际编译出的版本，便于事后核对镜像里的 Agent 版本。
          ./image-context/bin/amd64/agent -version || true
          ls -l image-context/bin/amd64 image-context/bin/arm64
          # node_modules / dist 很大且必须由镜像内重新安装与构建。
          # 用 printf 而不是 heredoc：heredoc 的内容必须顶格，会破坏 run: | 的
          # YAML 缩进，整个 workflow 变成无效文件（表现为 0 秒失败且没有 job）。
          printf '%s\n' web/node_modules web/dist web/tests > image-context/.dockerignore
          test -f image-context/web/package-lock.json
          test -f image-context/web/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Validate the non-root panel and host-nginx A/B routing before any push.
      # Uses the existing repository entry point, not a hypothetical CI command.
      - name: Validate local amd64 images before publishing
        run: |
          set -euo pipefail
          docker build --build-arg TARGETARCH=amd64 -f deploy/Dockerfile.panel \
            -t proxypanel-panel:ci image-context
          docker build --build-arg TARGETARCH=amd64 -f deploy/Dockerfile.agent \
            -t proxypanel-agent:ci image-context
          docker run --rm proxypanel-agent:ci -version > /tmp/agent-local-version.txt
          grep -q proxypanel-agent /tmp/agent-local-version.txt
          bash scripts/verify-panel-image.sh proxypanel-panel:ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Panel image metadata
        id: meta-panel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/proxypanel-panel
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push panel
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: deploy/Dockerfile.panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-panel.outputs.tags }}
          labels: ${{ steps.meta-panel.outputs.labels }}

      - name: Agent image metadata
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/proxypanel-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: deploy/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}

      # 冒烟测试：证明镜像里的二进制真的能在这个运行环境里启动。
      # 这不是完整功能验收——真实代理链路需要面板、数据库和一个官方核心。
      - name: Smoke test pushed images
        run: |
          set -euo pipefail
          AGENT="${{ env.REGISTRY }}/${{ github.repository_owner }}/proxypanel-agent:sha-${GITHUB_SHA::7}"
          PANEL="${{ env.REGISTRY }}/${{ github.repository_owner }}/proxypanel-panel:sha-${GITHUB_SHA::7}"
          echo "--- agent -version ---"
          docker run --rm "$AGENT" -version | tee /tmp/agent-version.txt
          grep -q 'proxypanel-agent' /tmp/agent-version.txt
          echo "--- 缺少主密钥必须拒绝启动（无需证书挂载） ---"
          if docker run --rm "$PANEL" > /tmp/panel-out.txt 2>&1; then
            echo 'panel unexpectedly started without master key' >&2
            exit 1
          fi
          grep -q 'PANEL_MASTER_KEY' /tmp/panel-out.txt
          docker run --rm --entrypoint /bin/sh "$PANEL" -ec '
            test -f /usr/share/proxypanel/web/index.html
            test -d /app/migrations
            test -x /app/install/deploy-agent.sh
            test -x /app/install/agents/linux-amd64/agent
            test -x /app/install/agents/linux-arm64/agent
            test "$(id -u)" != 0
            ! command -v nginx
          '
          # 真正启动单进程镜像，验证 SPA / API-only 两种运行模式。
          NET="pp-smoke-${GITHUB_RUN_ID}"
          DB="${NET}-db"
          APP="${NET}-panel"
          cleanup() {
            docker rm -f "$APP" "$DB" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$NET"
          docker run -d --name "$DB" --network "$NET" \
            -e POSTGRES_PASSWORD=smoke-password postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec "$DB" pg_isready -U postgres; then break; fi
            sleep 1
          done
          KEY=$(openssl rand -base64 32)
          for MODE in spa api; do
            ROOT=/usr/share/proxypanel/web
            [ "$MODE" = api ] && ROOT=''
            docker run -d --name "$APP" --network "$NET" \
              -p 127.0.0.1::8080 -e "PANEL_MASTER_KEY=$KEY" \
              -e "DATABASE_URL=postgres://postgres:smoke-password@$DB:5432/postgres?sslmode=disable" \
              -e "PANEL_PUBLIC_URL=https://panel.example.invalid" \
              -e "PANEL_WEB_ROOT=$ROOT" "$PANEL"
            PORT=$(docker port "$APP" 8080/tcp | awk -F: '{print $NF}')
            URL="http://127.0.0.1:$PORT"
            for i in $(seq 1 60); do
              if curl -fsS "$URL/healthz"; then break; fi
              sleep 1
            done
            curl -fsS "$URL/readyz"
            curl -fsS "$URL/install-agent.sh" | grep -q 'PROXYPANEL_INSTALL_AGENT_SHA256_AMD64'
            curl -fsS "$URL/install-agent/linux-amd64" -o /tmp/agent-from-panel
            chmod +x /tmp/agent-from-panel
            /tmp/agent-from-panel -version | grep -q proxypanel-agent
            rm -f /tmp/agent-from-panel
            test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/assets/missing.js")" = 404
            test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/unknown")" = 404
            if [ "$MODE" = spa ]; then
              curl -fsS "$URL/admin/nodes" | grep -q 'id="app"'
              curl -fsSI "$URL/index.html" | grep -iq 'cache-control: no-store'
            else
              test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/")" = 404
            fi
            docker rm -f "$APP"
          done

  web-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm audit --audit-level=high
          npm run typecheck
          NODE_ENV=development npm test
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 30
